services:
  - type: web
    name: cloud-nandy-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        value: https://wyjkehxbybkakgxdnoje.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: property-images
      - key: SUPABASE_TABLE
        value: properties
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: CCAVENUE_MERCHANT_ID
        value: "4450815"
      - key: CCAVENUE_ACCESS_CODE
        sync: false
      - key: CCAVENUE_WORKING_KEY
        sync: false
      - key: CCAVENUE_URL
        value: https://secure.ccavenue.com/transaction/transaction.do?command=initiateTransaction
      # After Render deploys, it gives you a URL like https://cloud-nandy-api.onrender.com
      # Set BACKEND_URL to that URL in Render dashboard → Environment
      # Also register that URL in your CCAvenue merchant account
      - key: BACKEND_URL
        value: https://cloud-nandy-api.onrender.com
      - key: FRONTEND_URL
        value: https://mnccoimbatore.in
